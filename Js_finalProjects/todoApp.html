
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-top: 50px;
            gap: 20px;
        }

        .child-1 {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .child-2-fields {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            background-color: white;
            padding: 10px 20px;
            border-radius: 8px;
            width: 300px;
        }

        .child-2 {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .add-task {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .delete-task {
            padding: 8px 12px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="main-container">

        <div class="child-1">
            <h1>To Do App</h1>
            <input type="text" class="add-task-input">
            <button class="add-task">Add New Task</button>
        </div>

        <div class="child-2">

            <div class="child-2-fields">
                <input type="checkbox">
                <p>Cook Food</p>
                <button class="delete-task">Delete</button>
            </div>

            <div class="child-2-fields">
                <input type="checkbox">
                <p>Do Laundry</p>
                <button class="delete-task">Delete</button>
            </div>

            <div class="child-2-fields">
                <input type="checkbox">
                <p>Study</p>
                <button class="delete-task">Delete</button>
            </div>

        </div>
    </div>
    <script>

        //Adding element
        const child2= document.querySelector(".child-2")
        document.querySelector(".add-task").addEventListener("click",()=>{
            const addTaskValue = document.querySelector(".add-task-input").value
            const newHtml = `<div class="child-2-fields">
                <input type="checkbox">
                <p>${addTaskValue}</p>
                <button class="delete-task">Delete</button>
            </div>
            `
            child2.insertAdjacentHTML("beforeend",newHtml)

        })

        //Deleting Element. we use event listener on parent cause its not being added by dom
      child2.addEventListener("click",(event)=>{
        if (event.target.classList.contains("delete-task")){
            event.target.parentElement.remove()

        }
      })
    </script>
</body>
</html>
